[project]
name = "bike-rental"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.12.21",
    "dotenv-cli>=3.4.1",
    "ipykernel>=7.2.0",
    "lakefs-spec>=0.14.0",
    "load-dotenv>=0.1.0",
    "matplotlib>=3.10.9",
    "mlflow>=3.13.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "ruff>=0.15.15",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "uvicorn>=0.42.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = ["dagster-webserver", "dagster-dg-cli"]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "D"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "bike_rental"
registry_modules = ["bike_rental.components.*"]
